[pytest]
# Construction_Flow.py is the whole suite, so it is collected by name.
python_files = Construction_Flow.py test_*.py

# Never collect the archived framework or the build folders. Reports/ is where
# every past execution's report lives, so it must never be walked into: without
# it pytest would rummage through every run ever made, and grow slower with each
# one.
norecursedirs =
    legacy .venv artifacts .idea __pycache__
    Reports allure-results allure-report allure-report-single allure-history

# Tests run in file order, which is what keeps the modules sequential:
# all Create_Your_Account rows, then all Customer rows, and so on.
addopts =
    -v
    --alluredir=allure-results
    --clean-alluredir
    --allure-no-capture

# Live logs in the console, in the same format as this run's execution.log.
# pytest prints these itself, with its own handler, for the phases it covers -
# collection and each test. run_config's console handler stands aside for
# exactly those stretches (QuietWhilePytestPrints) so no line is printed twice,
# and covers the phases pytest does not: startup, and the report being built at
# the end. execution.log gets every line either way.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(message)s
log_cli_date_format = %H:%M:%S
